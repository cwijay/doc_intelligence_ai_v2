# =============================================================================
# Cloud Build configuration for Document Intelligence AI
# =============================================================================
# This file is for future CI/CD automation. Currently, use the bash scripts
# for manual deployment.
#
# Manual trigger:
#   gcloud builds submit --config=.cloudbuild/cloudbuild.yaml \
#     --substitutions=_SERVICE_NAME=doc-intelligence-ai
#
# To set up automated triggers:
#   1. Connect your GitHub repository to Cloud Build
#   2. Create a trigger pointing to this config file
#   3. Set the substitution variables as needed
# =============================================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--concurrency=${_CONCURRENCY}'
      - '--timeout=${_TIMEOUT}'
      - '--port=8080'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest,GOOGLE_API_KEY=google-api-key:latest,LLAMA_CLOUD_API_KEY=llamaparse-api-key:latest,DATABASE_PASSWORD=DATABASE_PASSWORD:latest'
      - '--set-env-vars=CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},DATABASE_ENABLED=true,USE_CLOUD_SQL_CONNECTOR=true,CLOUD_SQL_IP_TYPE=PUBLIC,GCS_BUCKET=${_GCS_BUCKET},GCS_PREFIX=${_GCS_PREFIX},PARSED_DIRECTORY=parsed,GENERATED_DIRECTORY=generated,LOG_LEVEL=INFO'

# Substitution variables (can be overridden via --substitutions flag or trigger config)
substitutions:
  _SERVICE_NAME: 'doc-intelligence-ai'
  _REGION: 'us-central1'
  _MEMORY: '2Gi'
  _CPU: '2'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'
  _CLOUD_SQL_INSTANCE: 'biz2bricks-dev-v1:us-central1:doc-intelligence-db'
  _DATABASE_NAME: 'doc_intelligence'
  _DATABASE_USER: 'postgres'
  _GCS_BUCKET: 'biz2bricks-dev-v1-document-store'
  _GCS_PREFIX: ''

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Images to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/doc-intelligence/${_SERVICE_NAME}:latest'

# Build timeout (20 minutes)
timeout: '1200s'
