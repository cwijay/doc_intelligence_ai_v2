# =============================================================================
# Cloud Build: Document Intelligence AI API
# =============================================================================
# Automated CI/CD pipeline for Cloud Run deployment with GitHub integration.
#
# Triggers:
#   - develop branch → dev environment
#   - master branch → prod environment
#
# Manual deployment (development):
#   gcloud builds submit --config cloudbuild.yaml
#
# !! DO NOT USE THE PROD COMMAND BELOW AS WRITTEN !!
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_ENV=prod,_SECRET_SUFFIX=-prod
#
# It overrides only _ENV and _SECRET_SUFFIX. _SERVICE_NAME, _CLOUD_SQL_INSTANCE
# and _GCS_BUCKET all still default to DEVELOPMENT values, so that command
# reads -prod secrets while writing to the dev database and dev bucket, under a
# service still named "...-ai-api-dev". A production deploy must override every
# environment-specific substitution explicitly:
#
#   gcloud builds submit --config cloudbuild.yaml --substitutions=\
#     _ENV=prod,_SECRET_SUFFIX=-prod,\
#     _SERVICE_NAME=document-intelligence-ai-api,\
#     _CLOUD_SQL_INSTANCE=<PROD_PROJECT>:<REGION>:<PROD_INSTANCE>,\
#     _GCS_BUCKET=<PROD_BUCKET>,_LOG_LEVEL=INFO
#
# Timeline: ~5-7 minutes
# =============================================================================

options:
  # No machineType: naming one opts the build OUT of the 2,500 free
  # build-minutes/month, which only apply to the default pool's default
  # machine type. diskSizeGb likewise omitted to take the default.
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'

timeout: '1800s'

steps:
  # Step 1: Run automated tests
  # - Development: smoke tests only (fast)
  # - Production: full test suite
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        pip install --quiet --upgrade pip
        pip install --quiet -r requirements.txt

        if [ "${_ENV}" = "prod" ]; then
          echo "Running full test suite (production)..."
          pytest tests/unit/ -v --tb=short || exit 1
          echo "All production tests passed!"
        else
          echo "Running smoke tests (development)..."
          pytest tests/unit/ -v -m "smoke" --tb=short --ignore=tests/integration/ || true
          echo "Smoke tests completed!"
        fi

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api:${_ENV}-latest'
      - '.'
    waitFor: ['run-tests']

  # Step 3: Push all image tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-cloudrun'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying to Cloud Run (${_ENV})..."

        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${_RUNTIME_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com \
          --memory=${_MEMORY} \
          --cpu=${_CPU} \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --concurrency=${_CONCURRENCY} \
          --timeout=${_TIMEOUT} \
          --port=8080 \
          --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --update-secrets=OPENAI_API_KEY=openai-api-key${_SECRET_SUFFIX}:latest,GOOGLE_API_KEY=google-api-key${_SECRET_SUFFIX}:latest,LLAMA_CLOUD_API_KEY=llamaparse-api-key${_SECRET_SUFFIX}:latest,DATABASE_PASSWORD=DATABASE_PASSWORD${_SECRET_SUFFIX}:latest \
          --set-env-vars="CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},DATABASE_ENABLED=true,USE_CLOUD_SQL_CONNECTOR=true,CLOUD_SQL_IP_TYPE=PUBLIC,GCS_BUCKET=${_GCS_BUCKET},GCS_PREFIX=${_GCS_PREFIX},PARSED_DIRECTORY=parsed,GENERATED_DIRECTORY=generated,LOG_LEVEL=${_LOG_LEVEL}"

        echo "Deployment successful!"
    waitFor: ['push-image']

  # Step 5: Health check
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'health-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running health checks..."

        # Get service URL
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format="value(status.url)")
        echo "Service URL: $$SERVICE_URL"

        # Wait for service to be ready
        echo "Waiting 15 seconds for service to initialize..."
        sleep 15

        # Test health endpoint
        echo "Testing /health endpoint..."
        HTTP_STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/health")
        if [ "$$HTTP_STATUS" -eq 200 ]; then
          echo "Health check passed! (HTTP $$HTTP_STATUS)"
        else
          echo "Health check failed! (HTTP $$HTTP_STATUS)"
          exit 1
        fi

        echo ""
        echo "Deployment complete!"
        echo "Environment: ${_ENV}"
        echo "Service URL: $$SERVICE_URL"
    waitFor: ['deploy-to-cloudrun']

# Substitution variables
# Override these via Cloud Build triggers or --substitutions flag
substitutions:
  # Core settings
  _ENV: 'dev'
  _REGION: 'us-central1'
  _SERVICE_NAME: 'document-intelligence-ai-api-dev'
  _SECRET_SUFFIX: ''  # Empty for dev, '-prod' for production
  # Runtime identity, NAME ONLY -- the deploy step appends @$PROJECT_ID so the
  # account always resolves within the project the build is running in. Do not
  # put a full email here: this config is also used for prod via
  # --substitutions=_ENV=prod, and a hardcoded project would silently run the
  # production service under another environment's service account.
  # Without --service-account at all, Cloud Run falls back to the default
  # compute SA, which carries roles/run.admin and roles/storage.admin.
  _RUNTIME_SA_NAME: 'document-intelligence-api-sa'

  # Resource limits
  _MEMORY: '2Gi'
  _CPU: '2'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '5'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'
  _LOG_LEVEL: 'DEBUG'

  # Cloud SQL settings
  _CLOUD_SQL_INSTANCE: 'biz2bricks-dev-v1:us-central1:doc-intelligence-db'
  _DATABASE_NAME: 'doc_intelligence'
  _DATABASE_USER: 'postgres'

  # GCS settings
  _GCS_BUCKET: 'biz2bricks-dev-v1-document-store'
  _GCS_PREFIX: ''

# Store built images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/ai-api:${_ENV}-latest'

# Tags for build organization
tags:
  - 'ai-api'
  - '${_ENV}'

# =============================================================================
# Trigger Configuration Reference
# =============================================================================
#
# Development Trigger (develop branch):
#   Name: ai-api-dev-deploy
#   Branch: ^develop$
#   Substitutions: (use defaults)
#
# Production Trigger (master branch):
#   Name: ai-api-prod-deploy
#   Branch: ^master$
#   Substitutions:
#     _ENV: prod
#     _SERVICE_NAME: document-intelligence-ai-api-prod
#     _SECRET_SUFFIX: -prod
#     _LOG_LEVEL: INFO
#     _MAX_INSTANCES: 10
#     _CLOUD_SQL_INSTANCE: biz2bricks-prod:us-central1:doc-intelligence-db
#     _GCS_BUCKET: biz2bricks-prod-document-store
#
# =============================================================================
